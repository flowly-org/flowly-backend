services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: multikanban
      POSTGRES_USER: multikanban
      POSTGRES_PASSWORD: multikanban
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multikanban"]
      interval: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://multikanban:multikanban@db:5432/multikanban}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:8080}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
