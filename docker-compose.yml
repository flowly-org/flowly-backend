services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flowly
      POSTGRES_USER: flowly
      POSTGRES_PASSWORD: flowly
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowly"]
      interval: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://flowly:flowly@db:5432/flowly}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:8080}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      EMAIL_INBOUND_DOMAIN: ${EMAIL_INBOUND_DOMAIN:-}
      EMAIL_INBOUND_KEY: ${EMAIL_INBOUND_KEY:-}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/auto}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-polling}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    restart: unless-stopped
    ports:
      - "${API_BIND:-0.0.0.0}:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # Sends queued integration deliveries (webhooks, Slack, GitHub) with retries.
  worker:
    build: .
    # The api container runs migrations; the worker waits for them instead of racing it.
    entrypoint: ["sh", "-c", "until python manage.py migrate --check >/dev/null 2>&1; do sleep 2; done; exec python manage.py run_worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://flowly:flowly@db:5432/flowly}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/auto}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-polling}
      INTEGRATIONS_ALLOW_PRIVATE_URLS: ${INTEGRATIONS_ALLOW_PRIVATE_URLS:-0}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
